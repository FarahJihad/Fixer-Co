<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Fixer.Co</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <main class="login-screen">

    <!-- Background overlay -->
    <div class="login-overlay"></div>

    <!-- Logo -->
    <a href="index.html" class="login-brand">
      Fixer<span>.Co</span>
    </a>

    <!-- Left Content -->
    <section class="login-hero-content">

      <div class="hero-line"></div>

      <h1>
        Find the right fixer
        <span>today.</span>
      </h1>

      <div class="login-features">

        <div class="login-feature">
          <i class="fa-solid fa-shield-halved"></i>

          <div>
            <strong>Trusted</strong>
            <span>Professionals</span>
          </div>
        </div>

        <div class="feature-divider"></div>

        <div class="login-feature">
          <i class="fa-solid fa-bolt"></i>

          <div>
            <strong>Fast & Easy</strong>
            <span>Booking</span>
          </div>
        </div>

        <div class="feature-divider"></div>

        <div class="login-feature">
          <i class="fa-solid fa-house"></i>

          <div>
            <strong>A More</strong>
            <span>Comfortable Home</span>
          </div>
        </div>

      </div>

    </section>

    <!-- Login Card -->
    <section class="login-card">

      <div class="login-card-heading">
        <h2>Welcome Back</h2>
        <p>Log in to your account</p>
      </div>

      <form id="loginForm">

        <!-- Username -->
        <div class="login-input">

          <i class="fa-regular fa-user"></i>

          <input
            type="text"
            id="loginUsername"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
          >

        </div>

        <!-- Password -->
        <div class="login-input">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Show password"
          >
            <i class="fa-regular fa-eye"></i>
          </button>

        </div>

        <!-- Forgot Password -->
        <div class="forgot-row">
          <a href="#" id="forgotPasswordLink">
            Forgot password?
          </a>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="login-submit"
        >
          <span>Log In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Login Message -->
        <p
          id="loginMessage"
          class="login-message"
          aria-live="polite"
        ></p>

      </form>

      <!-- Divider -->
      <div class="login-divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>

      <!-- Google -->
      <button
        type="button"
        class="google-login"
        id="googleLoginButton"
      >

        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt=""
          class="google-icon"
        >

        Continue with Google

      </button>

      <!-- Create Account -->
      <p class="login-register">
        Don't have an account?

        <a href="register.html">
          Sign up
        </a>
      </p>

    </section>

    <!-- Top phrase -->
    <div class="login-top-text">
      Your Home. Our Priority.
      <span></span>
    </div>

  </main>

  <script src="script.js"></script>

</body>

</html>
